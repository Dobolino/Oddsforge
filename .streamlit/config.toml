[client]
# Hide the Deploy button and developer tools, but keep the settings menu
# (so the light/dark theme toggle stays available).
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
# Do not watch files for changes. On synced folders (OneDrive, Dropbox) the
# constant syncing otherwise triggers reloads and websocket disconnects
# ("connection error"). Updates take effect on the next start instead.
fileWatcherType = "none"
runOnSave = false

[theme]
# Dark by default; the user can still switch to light in the settings menu.
base = "dark"
primaryColor = "#4f8bf5"
